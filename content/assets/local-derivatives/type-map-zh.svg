<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f6b66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="16" fill="#faf9f6"/>
  <text x="380" y="34" text-anchor="middle" font-size="17" fill="#2b2b2b">场的类型与运算</text>

  <g font-size="15" fill="#2b2b2b" text-anchor="middle">
    <rect x="40" y="135" width="160" height="70" rx="10" fill="#ffffff" stroke="#3f6b66" stroke-width="1.5"/>
    <text x="120" y="162">标量场</text>
    <text x="120" y="188" font-size="14" fill="#6b6b6b" font-style="italic">f,  Δf,  ∇·F</text>
    <rect x="300" y="135" width="160" height="70" rx="10" fill="#ffffff" stroke="#3f6b66" stroke-width="1.5"/>
    <text x="380" y="162">向量场</text>
    <text x="380" y="188" font-size="14" fill="#6b6b6b" font-style="italic">F,  ∇f,  ∇×F</text>
    <rect x="560" y="135" width="160" height="70" rx="10" fill="#ffffff" stroke="#3f6b66" stroke-width="1.5"/>
    <text x="640" y="162">矩阵场</text>
    <text x="640" y="188" font-size="14" fill="#6b6b6b" font-style="italic">J<tspan dy="4" font-size="10">F</tspan><tspan dy="-4">,  H</tspan><tspan dy="4" font-size="10">f</tspan><tspan dy="-4"> = J</tspan><tspan dy="4" font-size="10">∇f</tspan><tspan dy="-4"></tspan></text>
  </g>

  <g stroke="#3f6b66" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M202,152 L298,152"/>
    <path d="M462,152 L558,152"/>
    <path d="M298,188 L202,188"/>
    <path d="M558,188 L462,188"/>
    <path d="M355,133 C 340,72 420,72 405,133"/>
    <path d="M640,207 C 600,310 160,310 120,207" stroke-dasharray="5 4"/>
  </g>

  <g font-size="13" fill="#3f6b66" text-anchor="middle">
    <text x="250" y="142">∇ 梯度</text>
    <text x="510" y="142">J 雅可比</text>
    <text x="250" y="228">∇· 散度</text>
    <text x="510" y="228">Div 逐行散度</text>
    <text x="380" y="68">∇× 旋度</text>
    <text x="380" y="300">tr 取迹（代数运算，不求导）</text>
  </g>

  <g font-size="14" fill="#2b2b2b" text-anchor="middle" font-style="italic">
    <text x="380" y="334" xml:space="preserve">∇·(∇f) = Δf = tr H<tspan dy="4" font-size="10">f</tspan><tspan dy="-4">      div F = tr J</tspan><tspan dy="4" font-size="10">F</tspan><tspan dy="-4">      ∇×(∇f) = 0      ∇·(∇×F) = 0</tspan></text>
  </g>
  <text x="380" y="368" text-anchor="middle" font-size="12" fill="#6b6b6b">每个箭头都是一次求导（虚线除外），箭头的两端是运算前后的类型</text>
</svg>
